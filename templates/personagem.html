<!--
  NOVO PERSONAGEM:
  1) Em js/catalog.js → personagensPorEra → lista, adicione { id, nome, desc, file, img } (img = arquivo em images/personagens/)
  2) Salve como pages/personagens/<id>.html
  3) Troque __NOME__, __BANNER__, __TITULO_POSTER__, textos do panfleto e dossiê; imagem ../../images/personagens/__ID__.jpg
-->
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__NOME__ — Os Sete Amaldiçoados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;700&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/global.css" />
  </head>
  <body>
    <div class="controls-fixed" aria-label="Controles de leitura">
      <button type="button" id="btn-font-minus">−</button>
      <button type="button" id="btn-font-plus">+</button>
      <button type="button" id="btn-theme">☀ Modo Claro</button>
      <a class="btn-home" href="../../index.html">← Início</a>
    </div>
    <main class="content-page wanted-file-page">
      <p class="wanted-breadcrumb">
        <a href="../../index.html">Início</a> · <a href="index.html">Personagens</a>
      </p>
      <article class="wanted-poster" aria-labelledby="nome-alvo">
        <p class="wanted-poster__banner">__BANNER__</p>
        <p class="wanted-poster__title">Procurado</p>
        <p class="wanted-poster__stamp">__CARIMBO__</p>
        <div class="wanted-poster__frame">
          <img class="wanted-poster__photo" src="../../images/personagens/__ID__.jpg" alt="" width="220" height="275" loading="lazy" />
        </div>
        <h1 id="nome-alvo" class="wanted-poster__name">__NOME__</h1>
        <p class="wanted-poster__aliases">__APELIDO__</p>
        <dl class="wanted-poster__facts">
          <div>
            <dt>Acusação</dt>
            <dd>__ACUSACAO__</dd>
          </div>
          <div>
            <dt>Recompensa</dt>
            <dd>__RECOMPENSA__</dd>
          </div>
        </dl>
        <p class="wanted-poster__footer">__RODAPE_POSTER__</p>
      </article>
      <section class="wanted-dossier">
        <h2>Descrição</h2>
        <p>__DESCRICAO__</p>
        <h2>Pontos</h2>
        <ul class="wanted-pontos">
          <li><strong>Ofício:</strong> __PONTO1__</li>
        </ul>
      </section>
    </main>
    <section class="contact-section">
      <a href="mailto:seu-email@exemplo.com" class="contact-btn">Contate-me</a>
    </section>
    <script src="../../js/main.js"></script>
  </body>
</html>
